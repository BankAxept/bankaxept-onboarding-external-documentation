site_name: BankAxept Onboarding documentation
site_dir: _site
site_url: https://test.com/
repo_url: https://github.com/BankAxept/bankaxept-onboarding-external-documentation#
repo_name: BankAxept/bankaxept-onboarding-external-documentation
docs_dir: docs
plugins:
  - mermaid2:
      arguments:
        theme: forest
  - search
  - redirects:
      redirect_maps:
        getting_started.md: index.md
        valid_account_numbers.md: test_data.md
nav:
  - Introduction: index.md
  - Integration:
      - Configuration: configuration.md
      - API Policy: api_policy.md
  - Flows:
      - Prod flows: prod_flows.md
      - Test flows: test_flows.md
      - Webhooks: webhooks.md
  - Test Data: test_data.md
  - Reference:
      - Dictionary: dictionary.md
      - MCC Codes: mcc_codes.md
      - Problems: problems.md
  - "OpenAPI Spec ↗": https://onboarding.bankaxept.no/swagger-ui/index.html#/
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js
  - assets/javascripts/account-number-generator.js
  - assets/javascripts/external-nav-links.js
extra_css:
  - assets/stylesheets/account-number-generator.css
  - assets/stylesheets/home.css
  - assets/stylesheets/nav-tabs.css
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.links
    - content.code.annotation
    - content.code.copy
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: deep-purple
      accent: purple
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: deep-purple
      accent: purple
  copyright: Copyright &copy; 2023 ePayment team
markdown_extensions:
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
